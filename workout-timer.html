<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>运动跟练计时器</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:sans-serif; background:#1a1a2e; color:#eee; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; }
.container { width:100%; max-width:400px; }
h1 { text-align:center; font-size:1.3em; margin-bottom:12px; color:#e94560; }

#ring-wrap { position:relative; width:200px; height:200px; margin:0 auto 16px; }
#ring { transform:rotate(-90deg); width:200px; height:200px; }
#ring circle { transition:stroke-dashoffset 0.3s; }
#timer { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:2.8em; font-weight:bold; color:#fff; }
#label { text-align:center; font-size:1em; margin-bottom:16px; color:#aaa; min-height:1.4em; }

.btn { display:block; width:100%; padding:14px; margin:8px 0; border:none; border-radius:12px; font-size:1.1em; font-weight:bold; cursor:pointer; color:#fff; -webkit-tap-highlight-color:transparent; }
.btn:active { opacity:0.8; }
#btn-go { background:linear-gradient(135deg,#e94560,#c23152); }
#btn-pause { background:linear-gradient(135deg,#f5a623,#d4891a); }
#btn-skip { background:linear-gradient(135deg,#4a90d9,#357abd); }
#btn-stop { background:linear-gradient(135deg,#888,#666); }
.btn-row { display:flex; gap:8px; }
.btn-row .btn { flex:1; }
.hide { display:none !important; }

.exercise { background:#16213e; border-radius:10px; padding:12px; margin:6px 0; display:flex; align-items:center; justify-content:space-between; cursor:pointer; border:2px solid transparent; }
.exercise.active { border-color:#e94560; }
.exercise.done { opacity:0.4; }
.ex-name { font-size:0.95em; }
.ex-info { font-size:0.8em; color:#aaa; }

#cd-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); display:flex; align-items:center; justify-content:center; z-index:99999; flex-direction:column; }
#cd-overlay.hide { display:none; }
#cd-num { font-size:7em; font-weight:bold; color:#e94560; }
#cd-label { font-size:1.1em; color:#aaa; margin-top:12px; }

#start-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:#1a1a2e; display:flex; align-items:center; justify-content:center; z-index:99998; flex-direction:column; }
#start-overlay.hide { display:none; }
#start-btn { padding:18px 50px; font-size:1.3em; background:#e94560; color:#fff; border:none; border-radius:14px; cursor:pointer; font-weight:bold; }
#start-btn:active { opacity:0.8; }

#status { text-align:center; font-size:0.8em; color:#555; margin-top:10px; }
</style>
</head>
<body>

<div id="start-overlay">
  <div style="font-size:2.5em;margin-bottom:20px;">🏋️</div>
  <div style="font-size:1.2em;color:#ccc;margin-bottom:30px;">腰背康复运动跟练</div>
  <button id="start-btn" onclick="doUnlock()">点击开始</button>
  <div style="margin-top:16px;color:#555;font-size:0.8em;">点击解锁音频</div>
</div>

<div class="container hide" id="main">
  <h1>运动跟练</h1>
  <div id="ring-wrap">
    <svg id="ring" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="90" fill="none" stroke="#333" stroke-width="8"/>
      <circle id="prog" cx="100" cy="100" r="90" fill="none" stroke="#e94560" stroke-width="8" stroke-linecap="round" stroke-dasharray="565.48" stroke-dashoffset="0"/>
    </svg>
    <div id="timer">00:00</div>
  </div>
  <div id="label">准备开始</div>

  <button class="btn" id="btn-go" onclick="doStart()">开始训练</button>
  <div class="btn-row hide" id="btns-run">
    <button class="btn" id="btn-pause" onclick="doPause()">暂停</button>
    <button class="btn" id="btn-skip" onclick="doSkip()">跳过</button>
    <button class="btn" id="btn-stop" onclick="doStop()">结束</button>
  </div>

  <div id="list" style="margin-top:16px;"></div>
  <div id="status">就绪</div>
</div>

<div id="cd-overlay" class="hide">
  <div id="cd-num">3</div>
  <div id="cd-label">准备</div>
</div>

<script>
// ===== 数据 =====
var EXS = [
  { name:'腰椎麦肯基疗法', dur:60, sets:3 },
  { name:'小燕飞', dur:30, sets:3 },
  { name:'侧平板支撑', dur:30, sets:3 },
  { name:'臀桥', dur:60, sets:3 },
  { name:'山羊挺身(靠墙版)', dur:20, sets:5 },
  { name:'平板支撑', dur:60, sets:2 }
];
var REST = 10;
// ===== 状态 =====
var idx = 0;    // 当前运动
var set = 0;    // 当前组
var ph = 0;      // 0=停 1=运动 2=休息
var rem = 0;     // 剩余秒
var tid = 0;     // setInterval ID
var paused = 0;   // 0=否 1=是
// ===== 音频 =====
var actx = null;
var aok = 0;

function unlock() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    // 播放一个静音真正解锁
    var buf = actx.createBuffer(1, 1, 22050);
    var src = actx.createBufferSource();
    src.buffer = buf;
    src.connect(actx.destination);
    src.start(0);
    aok = 1;
    log('✅ 音频已解锁');
  } catch(e) { log('音频解锁失败: ' + e.message); }
}

function beep(hz, len) {
  if (!actx) return;
  try {
    if (actx.state === 'suspended') actx.resume();
    var o = actx.createOscillator();
    var g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.frequency.value = hz || 800;
    o.type = 'sine';
    g.gain.setValueAtTime(0.3, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + (len || 0.15));
    o.start(actx.currentTime);
    o.stop(actx.currentTime + (len || 0.15));
  } catch(e) {}
}

function say(t) {
  try {
    if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t);
      u.lang = 'zh-CN';
      u.rate = 1.0;
      window.speechSynthesis.speak(u);
    }
  } catch(e) {}
}

// ===== Go West 节奏 =====
var gwId = 0;
var gwBt = 0;
function gwStart() {
  if (!actx || !aok) unlock();
  gwStop();
  gwBt = 0;
  gwId = setInterval(function() {
    try {
      if (actx.state === 'closed') { gwStop(); return; }
      if (actx.state === 'suspended') actx.resume();
      // 贝斯
      var notes = [131, 110, 147, 110];
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.connect(g); g.connect(actx.destination);
      o.type = 'sawtooth';
      o.frequency.value = notes[gwBt % 4];
      g.gain.setValueAtTime(0.06, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.35);
      o.start(actx.currentTime);
      o.stop(actx.currentTime + 0.35);
      // 鼓
      if (gwBt % 4 === 0) {
        var k = actx.createOscillator();
        var kg = actx.createGain();
        k.connect(kg); kg.connect(actx.destination);
        k.frequency.value = 80;
        k.frequency.exponentialRampToValueAtTime(40, actx.currentTime + 0.1);
        kg.gain.setValueAtTime(0.15, actx.currentTime);
        kg.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.12);
        k.start(actx.currentTime);
        k.stop(actx.currentTime + 0.12);
      }
      gwBt++;
    } catch(e) {}
  }, 500);
}
function gwStop() { if (gwId) { clearInterval(gwId); gwId = 0; } }

// ===== 3-2-1 倒计时 =====
function countdown(cb) {
  var el = document.getElementById('cd-overlay');
  var num = document.getElementById('cd-num');
  var lab = document.getElementById('cd-label');
  el.classList.remove('hide');
  ph = 3; // 用ph临时存倒计时状态
  var c = 3;
  num.textContent = String(c);
  lab.textContent = '准备: ' + EXS[idx].name;
  say(String(c));
  beep(600, 0.1);
  tid = setInterval(function() {
    c--;
    if (c > 0) {
      num.textContent = String(c);
      say(String(c));
      beep(600, 0.1);
    } else {
      clearInterval(tid);
      tid = 0;
      el.classList.add('hide');
      beep(900, 0.2);
      say('开始');
      if (cb) cb();
    }
  }, 1000);
}

// ===== UI 更新 =====
function ui() {
  var ex = EXS[idx];
  // 计时器
  var m = Math.floor(rem / 60);
  var s = rem % 60;
  document.getElementById('timer').textContent =
    (m<10?'0':'') + m + ':' + (s<10?'0':'') + s;
  // 标签
  if (ph === 1) {
    document.getElementById('label').textContent = ex.name + ' (第' + (set+1) + '/' + ex.sets + '组)';
  } else if (ph === 2) {
    document.getElementById('label').textContent = '休息中 (下一组: ' + ex.name + ')';
  }
  // 进度环
  var total = (ph===1) ? ex.dur : REST;
  var pct = rem / total;
  var circ = 2 * Math.PI * 90; // r=90
  document.getElementById('prog').setAttribute('stroke-dashoffset', String(circ * (1 - (1-pct))));
  // 列表
  var html = '';
  for (var i = 0; i < EXS.length; i++) {
    var cls = 'exercise';
    if (i === idx && ph !== 0) cls += ' active';
    if (i < idx) cls += ' done';
    html += '<div class="' + cls + '" onclick="jmp(' + i + ')">' +
      '<div><div class="ex-name">' + (i+1) + '. ' + EXS[i].name + '</div>' +
      '<div class="ex-info">' + EXS[i].dur + '秒 × ' + EXS[i].sets + '组</div></div>' +
      '<div style="color:#666;">' + (i<idx?'✅':i===idx&&ph!==0?'▶':'') + '</div></div>';
  }
  document.getElementById('list').innerHTML = html;
}

// ===== 每秒钟 =====
function tick() {
  if (ph === 0 || paused) return;
  rem--;
  // 最后5秒提示
  if (rem <= 5 && rem > 0) beep(1000, 0.08);
  if (rem <= 0) {
    // 阶段结束
    if (ph === 1) {
      // 运动结束
      set++;
      if (set >= EXS[idx].sets) {
        // 本运动全部完成，下一个
        set = 0;
        idx++;
        if (idx >= EXS.length) {
          // 全部完成
          clearInterval(tid);
          ph = 0;
          gwStop();
          say('训练完成！辛苦了！');
          beep(1200, 0.3);
          document.getElementById('btn-go').classList.remove('hide');
          document.getElementById('btns-run').classList.add('hide');
          log('训练完成！');
          ui();
          return;
        }
        // 下一个运动前先休息
        ph = 2;
        rem = REST;
        say('休息' + REST + '秒');
        gwStart();
      } else {
        // 下一组，先休息
        ph = 2;
        rem = REST;
        say('休息，准备下一组');
        gwStart();
      }
    } else if (ph === 2) {
      // 休息结束，开始下一组（先倒计时）
      ph = 1;
      rem = EXS[idx].dur;
      clearInterval(tid);
      countdown(function() {
        tid = setInterval(tick, 1000);
      });
      ui();
      return;
    }
  }
  ui();
}

// ===== 开始训练 =====
function doStart() {
  if (ph !== 0) return;
  idx = 0; set = 0; ph = 1; rem = EXS[0].dur;
  document.getElementById('btn-go').classList.add('hide');
  document.getElementById('btns-run').classList.remove('hide');
  countdown(function() {
    tid = setInterval(tick, 1000);
    gwStart();
  });
  ui();
  log('训练中...');
}

// ===== 暂停 =====
function doPause() {
  if (ph === 0) return;
  if (!paused) {
    // 暂停
    paused = 1;
    clearInterval(tid);
    document.getElementById('btn-pause').textContent = '继续';
    gwStop();
    log('已暂停');
  } else {
    // 继续
    paused = 0;
    document.getElementById('btn-pause').textContent = '暂停';
    tid = setInterval(tick, 1000);
    if (ph === 1) gwStart();
    log('继续训练...');
  }
}

// ===== 跳过 =====
function doSkip() {
  if (ph === 0) return;
  clearInterval(tid);
  gwStop();
  // 强制结束当前运动
  set = EXS[idx].sets;
  idx++;
  if (idx >= EXS.length) {
    ph = 0;
    say('训练完成！');
    document.getElementById('btn-go').classList.remove('hide');
    document.getElementById('btns-run').classList.add('hide');
    log('训练完成！');
    ui();
    return;
  }
  set = 0;
  // 先休息再开始
  ph = 2;
  rem = REST;
  say('已跳过，休息' + REST + '秒');
  countdown(function() {
    ph = 1;
    rem = EXS[idx].dur;
    tid = setInterval(tick, 1000);
    gwStart();
    ui();
  });
}

// ===== 结束 =====
function doStop() {
  clearInterval(tid);
  gwStop();
  ph = 0; paused = 0;
  document.getElementById('btn-go').classList.remove('hide');
  document.getElementById('btns-run').classList.add('hide');
  document.getElementById('btn-pause').textContent = '暂停';
  log('已结束');
  ui();
}

// ===== 跳转 =====
function jmp(i) {
  if (ph === 0) {
    idx = i; ui();
  } else {
    clearInterval(tid);
    gwStop();
    idx = i; set = 0;
    ph = 1; rem = EXS[idx].dur;
    countdown(function() {
      tid = setInterval(tick, 1000);
      gwStart();
      ui();
    });
  }
}

// ===== 解锁并开始 =====
function doUnlock() {
  unlock();
  setTimeout(function() {
    document.getElementById('start-overlay').classList.add('hide');
    document.getElementById('main').classList.remove('hide');
    ui();
    log(aok ? '✅ 音频已解锁' : '⚠️ 音频未解锁');
  }, 300);
}

function log(s) {
  var el = document.getElementById('status');
  if (el) el.textContent = s;
}

// 初始化
window.onload = function() { ui(); };
</script>
</body>
</html>
